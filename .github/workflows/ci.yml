name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check kauha tests ros2 hardware plc firmware
      - name: Tests with requirement traceability
        env:
          KAUHA_TRACE: results/traceability.json
        run: pytest
      - name: Fail if any safety requirement has no passing test
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("results/traceability.json"))
          need = [f"SR-{i:02d}" for i in range(1, 17)] + ["AR-01", "AR-02", "AR-03", "AR-04", "AR-05"]
          missing = [r for r in need if r not in m or not m[r]["all_passed"]]
          print("requirements covered:", len(m))
          sys.exit(f"uncovered or failing: {missing}" if missing else 0)
          PY
      - name: Prove the safety PLC properties
        run: python -m kauha.verify.prove
      - name: Safety case holds on the evidence
        run: python -m kauha.assurance.case --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assurance-evidence
          path: |
            results/traceability.json
            results/verification.json
            results/safety_case.json
            docs/results/safety_case.html

  ros2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ros2/environment.yml
          cache-environment: true
      - name: Build the ROS 2 workspace
        shell: bash -el {0}
        run: |
          pip install --no-deps -e .
          cd ros2 && colcon build
      - name: ROS 2 tests (URDF geometry, twin bridge, ROS-driven SIL over CAN)
        shell: bash -el {0}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          source ros2/install/setup.bash
          cd ros2/kauha_ros && python -m pytest -q -p no:cacheprovider test/


  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with the CAD extra
        run: pip install -e ".[dev,cad]"
      - name: CAD positions and interference sweep
        run: python -m hardware.cad.kauha_cad --check
      - name: 1:8 testbed CAD checks (strokes, 30 poses, stability)
        run: python -m hardware.scale.cad.scale_cad --check
      - name: CAD tests
        run: python -m pytest -q tests/hardware

  plc:
    # The CODESYS safety program, compiled with the matiec IEC 61131-3 compiler and
    # checked cycle by cycle against the proved Python reference.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q flex bison autoconf automake
          pip install -e ".[dev]"
      - name: Build matiec (pinned)
        run: |
          git clone -q https://github.com/beremiz/matiec.git "$HOME/matiec"
          cd "$HOME/matiec" && git checkout -q 01a3a6c0c29b9aa0322ab6aba6258ebef2e36155
          autoreconf -i && ./configure -q && make -j4 > /dev/null
      - name: ST equivalence, node glue and source checks
        env:
          KAUHA_IEC2C: /home/runner/matiec/iec2c
        run: python -m pytest -q tests/plc
      - name: Long equivalence run
        env:
          KAUHA_IEC2C: /home/runner/matiec/iec2c
        run: python -m kauha.verify.st_equivalence --cycles 200000
