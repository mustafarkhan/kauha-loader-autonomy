# Load-and-carry site (phase 2): the demo yard with a fixed hopper instead of the truck bay.
# World frame: x east, y north, metres. Headings in radians from +x.
site:
  name: demo-aggregates-yard-carry
  operating_area: [[-5, -32], [70, -32], [70, 30], [-5, 30]]
  walls:   # concrete block perimeter (seen by the scanners)
    - [[-6, -33], [71, -33]]
    - [[71, -33], [71, 31]]
    - [[71, 31], [-6, 31]]
    - [[-6, 31], [-6, -33]]

piles:   # two product bunkers side by side, separated by a 3 m gap
  - name: A
    material: gravel
    toe_x: 50.0          # pile faces -x; toe line at this x
    y_min: -7.5
    y_max: -1.5
    slot_width: 3.0
    height: 4.0
    depth: 18.0
  - name: B
    material: crushed_rock
    toe_x: 50.0
    y_min: 1.5
    y_max: 7.5
    slot_width: 3.0
    height: 3.5
    depth: 18.0

dig_zones:    # access-controlled exclusion zone in front of the faces
  A: [[40, -9.5], [75, -9.5], [75, 0], [40, 0]]
  B: [[40, 0], [75, 0], [75, 10.5], [40, 10.5]]

hopper:   # load-and-carry (phase 2): fixed receiving hopper over a feeder, ~40 m from the faces
  center: [8.0, -18.0]
  heading: 0.0
  length: 6.0          # opening along x
  width: 3.0
  capacity_t: 40.0
  feeder_t_h: 400.0    # the feeder draws material out continuously
  dock_offset: 3.4     # front axle to the hopper's near edge when dumping
  dock_zone: [[1, -16.6], [15, -16.6], [15, -8], [1, -8]]

landmarks:   # retroreflective posts for lidar localisation
  - [0, -30]
  - [30, -30]
  - [60, -30]
  - [68, -20]
  - [68, 9.5]
  - [68, 27]
  - [30, 28]
  - [0, 28]
  - [-3, 0]
  - [30, -24]

start_pose: [20.0, -2.0, 0.0]
