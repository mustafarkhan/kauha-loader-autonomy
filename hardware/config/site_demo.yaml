# Demo site: aggregates yard with two stockpiles and a truck loading bay.
# World frame: x east, y north, metres. Headings in radians from +x.
site:
  name: demo-aggregates-yard
  operating_area: [[-5, -32], [70, -32], [70, 30], [-5, 30]]
  walls:   # concrete block perimeter (seen by the scanners)
    - [[-6, -33], [71, -33]]
    - [[71, -33], [71, 31]]
    - [[71, 31], [-6, 31]]
    - [[-6, 31], [-6, -33]]

piles:   # two product bunkers side by side, separated by a 3 m gap
  - name: A
    material: gravel
    toe_x: 50.0          # pile faces -x; toe line at this x
    y_min: -7.5
    y_max: -1.5
    slot_width: 3.0
    height: 4.0
    depth: 18.0
  - name: B
    material: crushed_rock
    toe_x: 50.0
    y_min: 1.5
    y_max: 7.5
    slot_width: 3.0
    height: 3.5
    depth: 18.0

dig_zones:    # access-controlled exclusion zone in front of the faces
  A: [[40, -9.5], [75, -9.5], [75, 0], [40, 0]]
  B: [[40, 0], [75, 0], [75, 10.5], [40, 10.5]]

truck_bay:
  center: [40.0, -18.0]
  heading: 0.0
  length: 9.0
  width: 2.5
  capacity_t: 20.0
  dock_offset: 3.1      # front axle to truck side when dumping
  dock_zone: [[33, -16.6], [47, -16.6], [47, -8], [33, -8]]
  swap_time_s: 45.0     # gap between a full truck leaving and the next arriving

landmarks:   # retroreflective posts for lidar localisation
  - [0, -30]
  - [30, -30]
  - [60, -30]
  - [68, -20]
  - [68, 9.5]
  - [68, 27]
  - [30, 28]
  - [0, 28]
  - [-3, 0]
  - [30, -24]

start_pose: [20.0, -2.0, 0.0]
