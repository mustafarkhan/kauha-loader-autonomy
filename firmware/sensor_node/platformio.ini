; KAUHA 1:8 testbed: sensor_node. Build and upload: pio run -e teensy40 -t upload
; The shared, host-tested code lives in ../common (see tests/firmware).
[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps = https://github.com/tonton81/FlexCAN_T4.git
build_src_filter = +<*> +<../../common/*.c> +<../../common/generated/*.c>
build_flags = -I../common -Wall
