[project]
name = "kauha"
version = "0.3.0"
description = "Autonomy retrofit for articulated wheel loaders: digital twin, autonomy stack, independent safety channel"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "gymnasium>=0.29",
  "cantools>=39",
  "python-can>=4.3",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "torch>=2.2", "ultralytics>=8.3"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kauha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "B905"]
