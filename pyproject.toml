[project]
name = "kauha"
version = "0.4.0"
description = "Autonomy retrofit for articulated wheel loaders: digital twin, autonomy stack, independent safety channel"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "gymnasium>=0.29",
  "cantools>=39",
  "python-can>=4.3",
  "msgpack>=1.0",       # python-can UDP-multicast bus for the multi-process SIL
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "torch>=2.2", "ultralytics>=8.3"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "z3-solver>=4.12"]   # z3: safety PLC proofs
adversary = ["cma>=3.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kauha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: real-time multi-process tests (about 1 min)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
# `O` is the ops object (concrete or z3) that every safety-logic operation goes through.
"kauha/safety/core.py" = ["E741"]
# HTML templates as Python strings.
"kauha/assurance/render.py" = ["E501"]
